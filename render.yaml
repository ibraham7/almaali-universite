services:
  - type: web
    name: almaali-web
    runtime: static
    rootDir: apps/web
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    domains:
      - uni.novanoai.online
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: VITE_API_URL
        value: https://api.uni.novanoai.online
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: almaali-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm exec prisma generate --config prisma7.config.ts && pnpm run build
    preDeployCommand: pnpm exec prisma migrate deploy --config prisma7.config.ts
    startCommand: node dist/main.js
    healthCheckPath: /
    autoDeployTrigger: commit
    domains:
      - api.uni.novanoai.online
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: almaali-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://uni.novanoai.online

databases:
  - name: almaali-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: university_system
